<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      margin: 0;
      padding: 12px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 8px 0;
      color: #7eb8f7;
    }
    #status {
      margin: 8px 0;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      min-height: 20px;
    }
    .idle    { background: #2a2a3e; color: #aaa; }
    .sending { background: #2a3a2e; color: #7fc97f; }
    .success { background: #1e3a1e; color: #7fc97f; }
    .error   { background: #3a1e1e; color: #f07070; }
    .buttons { display: flex; gap: 6px; margin-top: 4px; }
    button {
      flex: 1;
      padding: 9px 6px;
      background: #7eb8f7;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #4a5a7a;
      color: #e0e0e0;
    }
    button:hover { filter: brightness(1.15); }
    button:disabled { background: #445; color: #888; cursor: default; filter: none; }
    #url-preview {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #selection-hint {
      font-size: 11px;
      color: #7eb8f7;
      margin-bottom: 4px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h1>🤖 GIR Clipper</h1>
  <div id="url-preview">Loading...</div>
  <div id="selection-hint"></div>
  <div id="status" class="idle">Ready to clip!</div>
  <div class="buttons">
    <button id="btn-page">📎 Full page</button>
    <button id="btn-selection" class="secondary" disabled>✂️ Selection</button>
  </div>
  <div class="buttons" style="margin-top:6px">
    <button id="btn-settings" class="secondary" style="flex:none;padding:6px 10px;font-size:12px">⚙️ Settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
